<div class="typing-wrapper cursor-text" (click)="inputRef.focus()">
    <div class="text-display font-mono text-2xl leading-relaxed tracking-wider relative">
      
      @for (c of chars; track $index) {
        <span
          class="char transition-colors duration-100"
          [class.text-race-primary]="c.state === 'correct'"
          [class.text-race-error]="c.state === 'wrong'"
          [class.border-l-2]="c.state === 'current'"
          [class.border-race-caret]="c.state === 'current'"
          [class.text-slate-500]="c.state === 'pending'"
          [class.bg-red-500/20]="c.state === 'wrong' && c.char === ' '"
        >
          {{ c.char === ' ' ? '\u00a0' : c.char }}
        </span>
      }
  
    </div>
  
    <input
      #inputRef
      class="opacity-0 absolute pointer-events-none"
      type="text"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
      (input)="onInput($event)"
    />
  </div>
