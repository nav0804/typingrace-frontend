<!-- Clicking the wrapper focuses the hidden input -->
<div class="typing-wrapper" (click)="focusInput()">
  <!-- The invisible engine capturing keystrokes -->
  <input
    #hiddenInputRef
    class="hidden-input"
    autocomplete="off"
    spellcheck="false"
    autocapitalize="off"
    (input)="onInputChange($event)"
    [value]="userInput"
  />

  <div class="text-display">
    <!-- Loop through each character and apply your exact CSS classes -->
    @for (char of text.split(''); track $index) {
    <span class="char" [ngClass]="getClass($index)">{{ char }}</span>
    }
  </div>

  <div class="input-hint">click to focus</div>
</div>
