<div class="page fade-in flex items-center justify-center">
  <div class="card w-full max-w-md">
    <div class="text-center mb-8">
      <h2 class="text-2xl font-semibold tracking-tight text-white mb-2">
        welcome_back
      </h2>
      <p class="text-sm text-[var(--text-2)]">sign in to start racing</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="space-y-6">
      <div>
        <label class="label">email address</label>
        <input
          formControlName="email"
          type="email"
          placeholder="name@domain.com"
          class="input-field"
        />
      </div>

      <div>
        <label class="label">password</label>
        <input
          formControlName="password"
          type="password"
          placeholder="••••••••"
          class="input-field"
        />
      </div>

      <button
        type="submit"
        [disabled]="loginForm.invalid"
        class="btn-primary w-full"
      >
        login_to_account
      </button>
    </form>

    <div class="divider"></div>

    <p class="text-center text-sm text-[var(--text-2)]">
      new to the track?
      <a
        routerLink="/auth/register"
        class="text-[var(--accent)] hover:underline ml-1"
        >create_account</a
      >
    </p>
  </div>
</div>
