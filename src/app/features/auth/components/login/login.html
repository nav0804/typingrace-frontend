<!-- Main container that takes up the remaining screen height -->
<div class="flex h-[calc(100vh-70px)] w-full items-center justify-center p-4">
  <!-- Centered Card with fixed max-width -->
  <div class="card w-full max-w-[420px] fade-in shadow-2xl">
    <div class="text-center mb-8">
      <h2 class="text-2xl font-bold tracking-tight text-white mb-2">
        welcome_back
      </h2>
      <p class="text-xs text-[var(--text-2)] uppercase tracking-[0.2em]">
        ready to race?
      </p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="space-y-6">
      <div>
        <label class="label">username</label>
        <input
          formControlName="username"
          type="username"
          placeholder="demoUser"
          class="input-field"
        />
      </div>

      <div>
        <label class="label">password</label>
        <input
          formControlName="password"
          type="password"
          placeholder="••••••••"
          class="input-field"
        />
      </div>

      <button
        type="submit"
        [disabled]="loginForm.invalid"
        class="btn-primary w-full py-3"
      >
        login_to_account
      </button>
    </form>

    <div class="divider my-8"></div>

    <p class="text-center text-sm text-[var(--text-2)]">
      new to the track?
      <a
        routerLink="/auth/register"
        class="text-[var(--accent)] hover:underline ml-1"
        >create_account</a
      >
    </p>
  </div>
</div>
